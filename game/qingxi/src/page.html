<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efdf"><title>归田小记 · 青溪村</title><style>/*STYLE*/</style></head><body>
<header><div class="brand"><span class="seal">归<br>田</span><strong>归田小记</strong><span class="brand-sub">田园生活手记</span></div><div class="header-actions"><span class="online"><i></i>本地存档</span><button id="wallet" aria-label="钱袋"></button><button id="audio" class="round" aria-label="开启环境声"></button><button id="settings" class="round" aria-label="游戏设置"></button></div></header>
<main id="stage"><div id="world" aria-label="可行走的三维村庄"></div><div class="vignette"></div>
<section class="where"><div class="eyebrow"><span></span> 徽州 · 青溪村</div><h1 id="place">归家小院</h1><div class="climate"><span id="clock"></span><i></i><span id="weather">天气同步中</span></div></section>
<aside class="task"><button id="journal"><span data-icon="book"></span><b>今日手记</b><span class="task-count" id="count"></span><span data-icon="arrow"></span></button><div id="tasks"></div></aside>
<div id="seeds" aria-label="选择种子" hidden><button data-seed="青菜" aria-pressed="true">青菜种</button><button data-seed="菊花" aria-pressed="false">菊花种</button></div><div id="toast" role="status"></div>
<div class="stage-foot"><div class="hint"><span class="mouse"></span> 点地行走 <em>·</em> 横拖转动视角</div><button id="nearby" hidden></button><div class="zoom"><button id="less" aria-label="拉远视角">−</button><span></span><button id="more" aria-label="拉近视角">＋</button></div></div></main>
<section class="dock"><button class="profile" id="profile"><span class="avatar"></span><span><small>归乡人 · 24岁</small><b>林舟 <i id="level"></i></b><span class="energy"><i></i></span></span></button><div class="tools" id="tools"></div><button class="mapbtn" id="map"></button></section>
<footer><span><i></i><span id="date"></span></span><button id="help"><span data-icon="help"></span>游玩指南</button></footer>
<dialog id="dialog"><div class="modal-head"><div><small>青 溪 村</small><h2 id="title"></h2></div><button class="round" id="close" aria-label="关闭">×</button></div><div id="content"></div></dialog><script>/*SCRIPT*/</script></body></html>
